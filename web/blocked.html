<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked – Scolect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e14;
      --card-bg: #16161f;
      --accent: #6B4EFF;
      --accent-grad: #9b7dff;
      --accent-alpha: rgba(107, 78, 255, 0.12);
      --accent-border: rgba(107, 78, 255, 0.22);
      --accent-text: #a78bff;
    }

    body[data-theme="purple_dream"] {
      --bg: #130a1e;
      --card-bg: #1d102e;
      --accent: #a855f7;
      --accent-grad: #ec4899;
      --accent-alpha: rgba(168, 85, 247, 0.15);
      --accent-border: rgba(168, 85, 247, 0.3);
      --accent-text: #c084fc;
    }
    body[data-theme="ocean_blue"] {
      --bg: #0b1528;
      --card-bg: #11203b;
      --accent: #38bdf8;
      --accent-grad: #818cf8;
      --accent-alpha: rgba(56, 189, 248, 0.15);
      --accent-border: rgba(56, 189, 248, 0.3);
      --accent-text: #7dd3fc;
    }
    body[data-theme="forest_green"] {
      --bg: #081a14;
      --card-bg: #0e2920;
      --accent: #34d399;
      --accent-grad: #a3e635;
      --accent-alpha: rgba(52, 211, 153, 0.15);
      --accent-border: rgba(52, 211, 153, 0.3);
      --accent-text: #6ee7b7;
    }
    body[data-theme="sunset_orange"] {
      --bg: #1c0e0b;
      --card-bg: #2b1712;
      --accent: #fb923c;
      --accent-grad: #f43f5e;
      --accent-alpha: rgba(251, 146, 60, 0.15);
      --accent-border: rgba(251, 146, 60, 0.3);
      --accent-text: #fdba74;
    }
    body[data-theme="monochrome"] {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #94a3b8;
      --accent-grad: #cbd5e1;
      --accent-alpha: rgba(148, 163, 184, 0.15);
      --accent-border: rgba(148, 163, 184, 0.3);
      --accent-text: #cbd5e1;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e8e8f0;
      transition: background 0.3s ease;
    }

    .card {
      text-align: center;
      padding: 48px 56px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--accent-border);
      box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--accent-alpha);
      max-width: 460px;
      width: 90vw;
    }

    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--accent-alpha);
      margin-bottom: 28px;
      border: 1px solid var(--accent-border);
    }

    .icon-wrap svg { width: 44px; height: 44px; }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-alpha);
      border: 1px solid var(--accent-border);
      border-radius: 6px;
      padding: 3px 10px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .domain {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 20px;
      word-break: break-all;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-grad));
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    /* Stats row */
    .stats {
      display: flex;
      gap: 1px;
      background: var(--accent-alpha);
      border: 1px solid var(--accent-border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .stat {
      flex: 1;
      padding: 14px 12px;
      background: var(--card-bg);
    }

    .stat + .stat { border-left: 1px solid var(--accent-border); }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin-bottom: 3px;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(136, 136, 160, 0.9);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Countdown */
    .reset-row {
      font-size: 13px;
      color: #8888a0;
      margin-bottom: 28px;
    }

    .reset-row strong {
      color: var(--accent-text);
      font-weight: 600;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      border: none;
    }

    button:active { transform: scale(0.97); }

    .btn-back {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-back:hover { opacity: 0.88; }

    .btn-dashboard {
      background: var(--accent-alpha);
      color: var(--accent-text);
      border: 1px solid var(--accent-border);
    }

    .btn-dashboard:hover { opacity: 0.88; }

    .btn-dashboard:hover { background: rgba(107, 78, 255, 0.2); }

    .btn-unblock {
      background: transparent;
      color: #555568;
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      padding: 9px 18px;
    }

    .btn-unblock:hover { color: #8888a0; border-color: rgba(255,255,255,0.12); }

    /* Unblock confirmation panel */
    .unblock-panel {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 80, 80, 0.06);
      border: 1px solid rgba(255, 80, 80, 0.18);
      border-radius: 12px;
      text-align: left;
    }

    .unblock-panel.visible { display: block; }

    .unblock-panel label {
      display: block;
      font-size: 13px;
      color: #8888a0;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .unblock-panel label strong { color: #e8e8f0; }

    .unblock-input-row {
      display: flex;
      gap: 8px;
    }

    .unblock-input {
      flex: 1;
      background: #0e0e14;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .unblock-input:focus { border-color: rgba(107, 78, 255, 0.5); }
    .unblock-input.error { border-color: rgba(255, 80, 80, 0.6); animation: shake 0.3s; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    .btn-confirm-unblock {
      background: rgba(255, 80, 80, 0.15);
      color: #ff7070;
      border: 1px solid rgba(255, 80, 80, 0.25);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-confirm-unblock:hover { background: rgba(255, 80, 80, 0.25); }
    .btn-confirm-unblock:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 4L6 10v10c0 9.375 6.8 18.15 16 20.25C31.2 38.15 38 29.375 38 20V10L22 4z"
              fill="rgba(107,78,255,0.22)" stroke="#6B4EFF" stroke-width="2" stroke-linejoin="round"/>
        <rect x="16" y="20" width="12" height="9" rx="2"
              fill="none" stroke="#a78bff" stroke-width="1.8"/>
        <path d="M18.5 20v-2.5a3.5 3.5 0 0 1 7 0V20"
              stroke="#a78bff" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="22" cy="24.5" r="1.3" fill="#a78bff"/>
      </svg>
    </div>

    <div class="badge">Scolect Screen Time</div>
    <h1>Daily Limit Reached</h1>
    <div class="domain" id="domain-label">this site</div>
    <div class="divider"></div>

    <!-- Usage stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="stat-spent">–</div>
        <div class="stat-label">Time spent</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-limit">–</div>
        <div class="stat-label">Daily limit</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-visits">–</div>
        <div class="stat-label">Visits today</div>
      </div>
    </div>

    <!-- Countdown to reset -->
    <div class="reset-row">
      Resets in <strong id="countdown">–</strong>
    </div>

    <div class="btn-group">
      <button class="btn-back" onclick="history.length > 1 ? history.back() : window.close()">Go Back</button>
      <button class="btn-dashboard" id="btn-dash">Open Dashboard</button>
      <button class="btn-unblock" id="btn-unblock-toggle">Unblock for today</button>
    </div>

    <!-- Unblock confirmation -->
    <div class="unblock-panel" id="unblock-panel">
      <label>Type <strong id="confirm-hint">the site name</strong> to unblock for the rest of today:</label>
      <div class="unblock-input-row">
        <input class="unblock-input" id="unblock-input" type="text" placeholder="" autocomplete="off" spellcheck="false" />
        <button class="btn-confirm-unblock" id="btn-confirm-unblock" disabled>Unblock</button>
      </div>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
