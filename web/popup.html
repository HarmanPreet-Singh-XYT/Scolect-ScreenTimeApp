<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <title>Scolect</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">

    <!-- ── Header ───────────────────────────────────────────── -->
    <div class="header">
      <div class="logo-row">
        <div class="logo-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="var(--accent)" stroke-width="2"/>
            <path d="M12 6v6l4 2" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">Scolect</span>
        <div id="modeChip" class="mode-chip">Standalone</div>
      </div>

      <!-- Active tracking bar — only shown when a domain is being tracked -->
      <div class="active-row" id="activeRow" style="display:none">
        <span class="pulse-dot"></span>
        <span class="active-label" id="activeLabel">Tracking…</span>
        <span class="active-duration" id="activeDuration"></span>
      </div>
    </div>

    <!-- ── Tab bar ───────────────────────────────────────────── -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabOverview">Overview</button>
      <button class="tab-btn" id="tabSite">Site</button>
      <!-- <button class="tab-btn" id="tabFocus">Focus</button> -->
    </div>

    <!-- ── Overview panel ───────────────────────────────────── -->
    <div id="panelOverview" class="tab-panel">

      <!-- ── Hero stat ──────────────────────────────────────────── -->
      <div class="today-card">
        <div class="today-card-inner">
          <div class="today-left">
            <div class="today-meta">Today's Web Time</div>
            <div class="today-time" id="todayTime">—</div>
            <div class="today-chips">
              <span class="stat-chip" id="chipSites">0 sites</span>
              <span class="stat-chip" id="chipVisits">0 visits</span>
            </div>
          </div>
          <div class="today-ring-wrap" aria-hidden="true">
            <svg class="today-ring" width="56" height="56" viewBox="0 0 56 56">
              <circle class="ring-track" cx="28" cy="28" r="22" fill="none" stroke-width="4"/>
              <circle class="ring-fill" id="ringFill" cx="28" cy="28" r="22" fill="none" stroke-width="4"
                stroke-dasharray="138.2" stroke-dashoffset="138.2"
                stroke-linecap="round" transform="rotate(-90 28 28)"/>
            </svg>
            <span class="ring-label" id="ringLabel">0%</span>
          </div>
        </div>
      </div>

      <!-- ── Mini info cards: focus + blocked ──────────────────── -->
      <div class="mini-cards">
        <div class="mini-card">
          <div class="mini-card-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 8v4l2.5 2.5"/>
            </svg>
          </div>
          <div class="mini-card-body">
            <div class="mini-card-value" id="focusCount">0</div>
            <div class="mini-card-label">Focus sessions</div>
          </div>
        </div>
        <div class="mini-card">
          <div class="mini-card-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
          </div>
          <div class="mini-card-body">
            <div class="mini-card-value" id="blockedCount">0</div>
            <div class="mini-card-label">Blocked today</div>
          </div>
        </div>
      </div>

      <!-- ── Top sites ──────────────────────────────────────────── -->
      <div class="section-header">
        <span class="section-label">Top Sites</span>
        <span class="section-hint" id="sectionHint"></span>
      </div>
      <div class="sites-list" id="sitesList">
        <div class="empty-state">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round">
            <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/>
            <path d="M3.6 9h16.8M3.6 15h16.8"/>
            <path d="M11.5 3a17 17 0 0 0 0 18"/>
            <path d="M12.5 3a17 17 0 0 1 0 18"/>
          </svg>
          <p>Start browsing to see<br>your top sites here.</p>
        </div>
      </div>

      <!-- ── Sync status (hybrid / tracker-only) ────────────────── -->
      <div class="sync-row" id="syncRow" style="display:none">
        <div class="sync-dot" id="syncDot"></div>
        <span class="sync-label" id="syncLabel">Connecting to desktop…</span>
        <span class="sync-time" id="syncTime"></span>
      </div>

    </div><!-- /panelOverview -->

    <!-- ── Site panel ────────────────────────────────────────── -->
    <div id="panelSite" class="tab-panel" style="display:none">
      <!-- Filled dynamically by renderSiteTab() -->
    </div>

    <!-- ── Focus panel ───────────────────────────────────────── -->
    <!-- <div id="panelFocus" class="tab-panel" style="display:none">
      Filled dynamically by renderFocusTab()
    </div> -->

    <!-- ── Footer actions ─────────────────────────────────────── -->
    <div class="footer">
      <button class="btn-ghost" id="settingsBtn" title="Settings">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Settings
      </button>
      <button class="btn-primary" id="openDashBtn">
        Open Dashboard
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
